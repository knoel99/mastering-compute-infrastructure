# GENERATED by gen_rules.py: do not edit. SLO 95.0% of jobs start within 600 s, 30-day period.
# Alerts carry no `for:` on purpose: the two windows already filter blips (SRE Workbook, ch. 5).
groups:
- name: slo-recording
  interval: 1m
  rules:
  - record: slo:slurm_job_wait_seconds_over_600:error_ratio_rate5m
    expr: 1 - (sum(rate(slurm_job_wait_seconds_bucket{le="600.0"}[5m])) / sum(rate(slurm_job_wait_seconds_count[5m])))
  - record: slo:slurm_job_wait_seconds_over_600:error_ratio_rate30m
    expr: 1 - (sum(rate(slurm_job_wait_seconds_bucket{le="600.0"}[30m])) / sum(rate(slurm_job_wait_seconds_count[30m])))
  - record: slo:slurm_job_wait_seconds_over_600:error_ratio_rate1h
    expr: 1 - (sum(rate(slurm_job_wait_seconds_bucket{le="600.0"}[1h])) / sum(rate(slurm_job_wait_seconds_count[1h])))
  - record: slo:slurm_job_wait_seconds_over_600:error_ratio_rate6h
    expr: 1 - (sum(rate(slurm_job_wait_seconds_bucket{le="600.0"}[6h])) / sum(rate(slurm_job_wait_seconds_count[6h])))
  - record: slo:slurm_job_wait_seconds_over_600:error_ratio_rate3d
    expr: 1 - (sum(rate(slurm_job_wait_seconds_bucket{le="600.0"}[3d])) / sum(rate(slurm_job_wait_seconds_count[3d])))
- name: slo-alerts
  interval: 1m
  rules:
  - alert: JobWaitSLOFastBurn
    expr: slo:slurm_job_wait_seconds_over_600:error_ratio_rate1h > 0.72 and slo:slurm_job_wait_seconds_over_600:error_ratio_rate5m > 0.72
    labels:
      severity: page
      slo: burn
    annotations:
      summary: queue-wait SLO burning at 14.4x or more (windows 1h and 5m); 2% of the 30-day budget per 1h
      runbook_url: runbooks/JobWaitSLOFastBurn.md
  - alert: JobWaitSLOSlowBurn
    expr: slo:slurm_job_wait_seconds_over_600:error_ratio_rate6h > 0.3 and slo:slurm_job_wait_seconds_over_600:error_ratio_rate30m > 0.3
    labels:
      severity: page
      slo: burn
    annotations:
      summary: queue-wait SLO burning at 6.0x or more (windows 6h and 30m); 5% of the 30-day budget per 6h
      runbook_url: runbooks/JobWaitSLOSlowBurn.md
  - alert: JobWaitSLOTicket
    expr: slo:slurm_job_wait_seconds_over_600:error_ratio_rate3d > 0.05 and slo:slurm_job_wait_seconds_over_600:error_ratio_rate6h > 0.05
    labels:
      severity: ticket
      slo: burn
    annotations:
      summary: queue-wait SLO burning at 1.0x or more (windows 3d and 6h); 10% of the 30-day budget per 3d
      runbook_url: runbooks/JobWaitSLOTicket.md
