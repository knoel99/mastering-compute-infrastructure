# FICTIONAL ASSUMPTIONS for lab 15.3. Money is in arbitrary units (u): do not read these numbers as the market.
# Only node_power_kw_max is a published figure: NVIDIA DGX H100 user guide, "10.2 kW max." (read 2026-10-24).
# Replace every value with your own quotes, dated and sourced, before using the tool for a real decision.
gpus_per_node: 8

owned:                          # you buy the nodes and pay for the facility
  node_price_u: 280000          # example: price of one 8-GPU node
  fabric_storage_frac: 0.25     # example: network + storage capex as a fraction of node price
  life_years: 4                 # example: accounting/economic life, to be agreed with finance
  residual_frac: 0.10           # example: resale value at end of life, fraction of node price
  cost_of_capital: 0.08         # example: yearly
  support_frac_per_year: 0.06   # example: spares + extended warranty, fraction of node price per year
  staff_u_per_year_per_100_gpus: 30000   # example: operations staff
  node_power_kw_max: 10.2       # PUBLISHED (DGX H100 user guide)
  idle_power_frac: 0.30         # example: draw of an idle node, fraction of max
  busy_power_frac: 0.75         # example: average draw of a fully busy node, fraction of max
  facility: colo                # onprem | colo
  pue: 1.4                      # example (power usage effectiveness of the facility)
  energy_u_per_kwh: 0.12        # example
  facility_u_per_kw_month:      # example: price of one kW of reserved IT capacity per month
    onprem: 90
    colo: 160

committed:                      # pay for every hour of the term, used or not
  lease_3y: {u_per_gpu_hour: 2.6, term_years: 3}
  reserved_1y: {u_per_gpu_hour: 3.2, term_years: 1}

on_demand: {u_per_gpu_hour: 4.0}          # example: pay only for allocated hours

spot:                                     # example: cheap but interruptible
  u_per_gpu_hour: 1.6
  mtbi_hours: 20                          # mean time between interruptions of one allocation
  checkpoint_minutes: 3
  restart_minutes: 10
