# One example to start from. Every alert needs at least one case that fires AND one that stays quiet.
rule_files:
  - gpu.rules.yml
evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="n1",gpu="0"}'
        values: '0x10 79x40'
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="n1",gpu="1"}'
        values: '0x50'
    alert_rule_test:
      - alertname: GPUXidError
        eval_time: 2m
        exp_alerts: []
      - alertname: GPUXidError
        eval_time: 5m
        exp_alerts:
          - exp_labels: {severity: page, Hostname: n1, gpu: "0"}
            exp_annotations: {summary: "XID 79 on n1 gpu 0"}
