# Thresholds are ILLUSTRATIVE and tied to the simulator: calibrate them on your own fleet.
# TO COMPLETE (milestone 2): GPUThermalThrottle, JobStalled, GPUIdleAllocated — see the project page.
groups:
  - name: gpu
    interval: 15s
    rules:
      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "XID {{ $value }} on {{ $labels.Hostname }} gpu {{ $labels.gpu }}"
