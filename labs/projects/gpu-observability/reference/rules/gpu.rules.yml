# Thresholds are ILLUSTRATIVE and tied to the simulator: calibrate them on your own fleet.
groups:
  - name: gpu
    interval: 15s
    rules:
      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "XID {{ $value }} on {{ $labels.Hostname }} gpu {{ $labels.gpu }}"

      - alert: GPUThermalThrottle
        expr: DCGM_FI_DEV_GPU_TEMP > 80
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.Hostname }} gpu {{ $labels.gpu }} at {{ $value }} C"

      - alert: JobStalled
        expr: avg by (job) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE * on (Hostname, gpu) group_left (job) slurm_job_gpu_allocated) < 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "job {{ $labels.job }} stalled: tensor pipe idle"

      - alert: GPUIdleAllocated
        expr: avg by (job) (DCGM_FI_DEV_GPU_UTIL * on (Hostname, gpu) group_left (job) slurm_job_gpu_allocated) < 5
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "job {{ $labels.job }} holds idle GPUs"
