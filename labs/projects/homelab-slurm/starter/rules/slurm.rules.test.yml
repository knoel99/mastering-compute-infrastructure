# One example to start from. Every alert needs at least one case that fires AND one that stays quiet.
rule_files:
  - slurm.rules.yml
evaluation_interval: 15s

tests:
  # Exporter stale: scrape_ok drops to 0, and separately the series disappears altogether.
  - interval: 15s
    input_series:
      - series: 'slurm_scrape_ok{instance="a"}'
        values: '1x40 0x80'
    alert_rule_test:
      - alertname: SlurmExporterStale
        eval_time: 8m
        exp_alerts: []
      - alertname: SlurmExporterStale   # scrape_ok has been 0 for 4m45s only: `for: 5m` is not over yet
        eval_time: 15m
        exp_alerts: []
      - alertname: SlurmExporterStale
        eval_time: 17m
        exp_alerts:
          - exp_labels: {severity: page, instance: a}
            exp_annotations: {summary: "Slurm metrics are missing or stale"}
  - interval: 15s
    input_series:
      - series: 'slurm_scrape_ok{instance="a"}'
        values: '1x10 _x100'
    alert_rule_test:
      - alertname: SlurmExporterStale
        eval_time: 6m
        exp_alerts: []
      - alertname: SlurmExporterStale
        eval_time: 14m
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations: {summary: "Slurm metrics are missing or stale"}

