---
# bmc_user and bmc_password come from a vaulted variables file passed with -e @file.
# The task uses no_log so that neither the output nor --diff can print the password.
- name: Deploy BMC credentials for the node health agent
  hosts: gpu_nodes
  gather_facts: false
  tasks:
    - name: Create the credentials directory
      ansible.builtin.file:
        path: "{{ node_root }}/etc/gpu-node"
        state: directory
        mode: "0700"

    - name: Write the credentials file readable by root only
      ansible.builtin.copy:
        content: |
          user={{ bmc_user }}
          password={{ bmc_password }}
        dest: "{{ node_root }}/etc/gpu-node/bmc.env"
        mode: "0600"
      no_log: true
