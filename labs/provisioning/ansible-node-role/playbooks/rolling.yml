---
# Rolling change: one canary node first, then the rest; abort everything if the canary fails.
# fail_host (extra var) injects a failure on one node to prove the abort path.
- name: Roll the node configuration out in batches
  hosts: gpu_nodes
  gather_facts: false
  serial:
    - 1
    - "100%"
  max_fail_percentage: 0
  vars:
    fail_host: ""
  pre_tasks:
    - name: Record that the node is taken out of scheduling (simulated drain)
      ansible.builtin.lineinfile:
        path: "{{ lab_root }}/rollout.log"
        line: "{{ now(utc=true, fmt='%H:%M:%S.%f') }} drain {{ inventory_hostname }}"
        create: true
        mode: "0644"
      delegate_to: localhost
  roles:
    - role: gpu_node
  post_tasks:
    - name: Inject a failure on the chosen node
      ansible.builtin.fail:
        msg: "injected failure on {{ inventory_hostname }}"
      when: inventory_hostname == fail_host
    - name: Record that the node is back in scheduling (simulated resume)
      ansible.builtin.lineinfile:
        path: "{{ lab_root }}/rollout.log"
        line: "{{ now(utc=true, fmt='%H:%M:%S.%f') }} resume {{ inventory_hostname }}"
        create: true
        mode: "0644"
      delegate_to: localhost
