# Three simulated GPU nodes. All use the local connection: each node gets its own
# directory ({{ lab_root }}/<name>) that plays the role of the node's root filesystem.
# On a real fleet you would drop ansible_connection and node_root (see README).
all:
  children:
    gpu_nodes:
      hosts:
        gpu-n01: {}
        gpu-n02: {}
        gpu-n03: {}
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        node_root: "{{ lab_root }}/{{ inventory_hostname }}"
