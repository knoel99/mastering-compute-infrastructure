# The same Job with native gang scheduling (alpha in v1.36, gate WorkloadWithJob; the Workload and
# PodGroup APIs are beta in v1.37, gate GenericWorkload, both disabled by default).
# gang.minCount is omitted: it defaults to .spec.parallelism, i.e. 8.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-gang
  namespace: default
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  backoffLimit: 0
  scheduling:
    schedulingPolicy:
      gang: {}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: registry.example/train:1   # never pulled: this cluster has no kubelet
          resources:
            limits:
              nvidia.com/gpu: 8
