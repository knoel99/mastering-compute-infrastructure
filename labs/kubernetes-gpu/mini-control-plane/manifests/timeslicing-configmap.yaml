# NVIDIA GPU Operator time-slicing configuration (structure from the GPU Operator documentation):
# each physical GPU is advertised as 4 nvidia.com/gpu. There is no memory or fault isolation between replicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 4
