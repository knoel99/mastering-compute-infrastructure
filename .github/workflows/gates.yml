name: gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install -r requirements.txt
      - name: Check gates
        run: |
          python3 tools/check_gates.py
          python3 programmes/check_links.py --self-test
          python3 programmes/check_links.py --check

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install -r requirements.txt
      - name: Install Quarto
        run: pip install quarto-cli==1.7.32
      - name: Build
        run: python3 tools/build.py
      - name: Working tree clean
        run: test -z "$(git status --porcelain)"
